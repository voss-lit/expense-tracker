 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <section>
        <div class="first-con">
            <h1>My Expense</h1>
            <p>Simply track your spending</p>
        </div>
        <!-- <div class="second-con">

        </div> -->
    </section>

    <div class="card">
        <p class="Total expense">Total expenses</p>
        <p class="total-amount" id="totalAmount">KSH 0.00</p>
        <p class="note" id="totalNote">Converted to kenyan shillings</p>
    </div>

    <div class="card-2">
        
        <div class="card">
            <p>Total transactions</p>
            <p id="transactionCount">0</p>
        </div>

        <div class="card">
            <p>Cartegories</p>
            <p id="categoryCount">0</p>
     </div>

    </div>

    <div class="card">
    <label for="homeCurrency">Home currency</label>

    <select id="homeCurrency">
        <option value="KES" selected>KES - Kenyan Shilling</option>
        <option value="USD">USD - US Dollar</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="JPY">JPY - Japanese Yen</option>
    </select>
</div>


    <div class="form-card">

            <h2>Add an expense</h2>
            <label for="desc">Description</label>
            <input id="desc"  type="text" placeholder="e.g breakfast">
        

        <div class="row">

            <div>
                <label for="amount">Amount</label>
                <input id="amount" type="number" placeholder="400">
            </div>


                 <!-- shows the currency youve spent -->
            <div>
                <label for="currency">currency</label>
                <select name="" id="currency" required>
                    <option value="KES">KES</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="JPY">JPY</option>
                </select>
            </div>

        </div>

        <label for="cartegory">Category</label>
                <select name="" id="category" required>
                    <option value="Transport">Transport</option>
                    <option value="Food">Food</option>
                    <option value="Luxury">Luxury</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Others">Others</option>
                </select>
        
         <button class="btn">+ Add Expense</button>

    </div>


    <div class="card">

        <h2>Your expenses</h2>

        <label for="filterCategory">Filter by Category</label>
        <select name="" id="filterCategory">
            <option value="all">All Cartegories</option>
            <option value="Transport">Transport</option>
            <option value="Food">Food</option>
            <option value="Luxury">Luxury</option>
            <option value="Shopping">Shopping</option>
            <option value="Others">Others</option>
        </select>

        <div id="expenseList">
        <p>No expenses added yet.</p>
        </div>

    </div>

    <script type="module" src="./src/main.js"></script>

 </body>
 </html>
